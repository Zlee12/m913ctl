[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "m913ctl"
dynamic = ["version"]
description = "Configure the Redragon M913 gaming mouse's onboard buttons, macros, DPI and lighting on Linux"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["redragon", "m913", "mouse", "hidraw", "macro", "dpi", "gaming", "linux", "wayland"]
authors = [{ name = "Zlee12" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware :: Hardware Drivers",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Zlee12/m913ctl"
Source = "https://github.com/Zlee12/m913ctl"
Issues = "https://github.com/Zlee12/m913ctl/issues"

[project.scripts]
m913ctl = "m913ctl.cli:main"

[tool.setuptools]
packages = ["m913ctl"]

[tool.setuptools.dynamic]
version = { attr = "m913ctl.__version__" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
